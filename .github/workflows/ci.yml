name: CI
on:
  push:
    branches: [slisarenko_ci]      # своя ветка — прогон при разработке
  pull_request:
    branches: [main]      # прогон на PR перед сдачей
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Run tests
        run: mvn test
      - name: Upload Allure report
        if: always()  # даже если тесты упали, загружаем отчёт
        uses: actions/upload-artifact@v3
        with:
          name: allure-report
          path: target/allure-results
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Download test results
        uses: actions/download-artifact@v3
        with:
          name: test-results
      - name: Generate Allure report
        run: mvn allure:report
      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: allure-report
          path: target/site/allure-maven-plugin/