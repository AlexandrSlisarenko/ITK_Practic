name: CI

on:
  push:
    branches: [slisarenko_ci]      # своя ветка — прогон при разработке
  pull_request:
    branches: [main]      # прогон на PR перед сдачей

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run tests
        run: ./mvnw -B -ntp test
      - name: Upload Allure report
        if: always()  # даже если тесты упали, загружаем отчёт
        uses: actions/upload-artifact@v3
        with:
          name: allure-report
          path: target/allure-results