name: NewCISlisarenko
run-name: ${{ github.actor }} is legn GitHub Action
on:
  push:
    branches: [slisarenko-ci]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-project-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
      - name: Run tests
        run: ./mvnw -B -ntp test
        env:
          SELENIDE_HEADLESS: 'true'
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results