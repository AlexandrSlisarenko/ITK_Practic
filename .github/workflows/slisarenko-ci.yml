name: NewCI
on:
  push:
    branches: [slisarenko_ci]
  pull_request:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: maven }
      - run: mvn -B -ntp test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: target/allure-results

  report:
    needs: tests
    if: always()               # ← обязательно, иначе при падении тестов отчёт не соберётся
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: maven }
      - uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: target/allure-results
      - run: mvn -B -ntp allure:report
      - uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/site/allure-maven-plugin