name: NewCISlisarenko
run-name: ${{ github.actor }} is legn GitHub Action
on:
  push:
    branches: [slisarenko-ci]
jobs:
  build-project-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
      - name: packaging
        run: mvn clean package